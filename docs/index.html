<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gastos da Viagem</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Viagem">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="banner" class="banner" hidden></div>
  <header id="top"><h1 id="title">Gastos da Viagem</h1></header>
  <main id="app" aria-live="polite"><p class="muted center">Carregando…</p></main>
  <nav id="tabs" aria-label="Seções" hidden></nav>
  <div id="sheet" class="overlay" hidden></div>
  <div id="dialog" class="overlay dim" hidden></div>
  <div id="toast" role="status" hidden></div>
  <input id="filePicker" type="file" accept="application/json,.json" hidden>
  <input id="schedPicker" type="file" accept="application/json,.json" hidden>
  <noscript><p>Este app precisa de JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
